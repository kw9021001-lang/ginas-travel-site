name: Daily website report
on:
  schedule:
    - cron: '0 7 * * *'   # every day at 07:00 UTC (07:00/08:00 UK)
  workflow_dispatch: {}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send yesterday's report
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_TO: ${{ vars.REPORT_TO }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
        run: node scripts/daily-report.mjs
